name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check heartsync scripts tests --select E,F,W --ignore E501
      - name: Compile check
        run: python -m compileall -q heartsync scripts tests
      - name: Unit, API, security and integration tests
        run: python -m unittest discover -s tests -t . -v

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install -r requirements.txt
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: bash e2e/run.sh
