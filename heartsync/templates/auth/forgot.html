{% extends "base.html" %}
{% block title %}Reset password · {{ settings.brand_name }}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card pad-lg auth-card">
    <h1>Forgot your password?</h1>
    <p class="muted">Enter your email and we'll send you a link to choose a new one.</p>
    <form data-api="/api/auth/password/forgot" data-stay data-success="If an account exists for that email, we've sent a reset link. Check your inbox." novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <p class="notice" data-form-status hidden></p>
      <button class="btn primary block mt-1" type="submit">Send reset link</button>
    </form>
    <p class="center small mt-1"><a href="/login">Back to sign in</a></p>
  </div>
</div>
{% endblock %}
